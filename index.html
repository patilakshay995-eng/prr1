<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eceff0;--panel:#fafbfb;--ink:#17262b;--mute:#5f7279;--line:#d3dadc;--accent:#0d7a78;--warn:#c4492e;--ok:#2f8a4f;--amber:#b7820f}
@media (prefers-color-scheme:dark){:root{--bg:#10191c;--panel:#17242a;--ink:#e6eeef;--mute:#8da3aa;--line:#2a3b42;--accent:#3cc2bd;--warn:#ef7a5f;--ok:#58c47c;--amber:#e0b04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px;margin-bottom:20px}
h1{font:700 34px/1.1 'Barlow Condensed',sans-serif;margin:0}
h2{font:600 20px/1.2 'Barlow Condensed',sans-serif;margin:0 0 12px}
.sub{color:var(--mute);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.kpi b{display:block;font:700 40px/1.1 'Barlow Condensed',sans-serif}
.kpi span{color:var(--mute);font-size:14px}
.kpi small{display:block;margin-top:4px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--warn)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.chart{position:relative;height:260px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid currentColor}
.Running{color:var(--ok)}.Slow{color:var(--amber)}.Down{color:var(--warn)}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Production dashboard</h1><div class="sub" id="range"></div></div>
  <div class="sub" id="updated"></div>
</header>

<section class="kpis" id="kpis"></section>

<section class="grid">
  <div class="panel"><h2>Daily output vs target</h2><div class="chart"><canvas id="outChart" role="img" aria-label="Daily output compared with target"></canvas></div></div>
  <div class="panel"><h2>Downtime by cause (hours)</h2><div class="chart"><canvas id="dtChart" role="img" aria-label="Downtime hours by cause"></canvas></div></div>
</section>

<section class="panel">
  <h2>Line status</h2>
  <div class="scroll"><table>
    <thead><tr><th>Line</th><th>Product</th><th class="n">Output today</th><th class="n">Target</th><th class="n">OEE</th><th class="n">Scrap</th><th>Status</th></tr></thead>
    <tbody id="lines"></tbody>
  </table></div>
</section>
</main>

<script>
/* ---- EDIT THIS: replace with your real numbers, or put the same
   structure in a data.json file next to index.html and it will load automatically ---- */
const SAMPLE = {
  updated: "2026-10-24 08:00",
  days: ["Oct 11","Oct 12","Oct 13","Oct 14","Oct 15","Oct 16","Oct 17","Oct 18","Oct 19","Oct 20","Oct 21","Oct 22","Oct 23","Oct 24"],
  output: [4120,4260,3980,4410,4390,4520,4180,4300,4470,4050,4560,4610,4480,4390],
  target: 4400,
  scrapPct: [2.4,2.1,2.9,2.0,2.2,1.9,2.5,2.3,2.0,3.1,1.8,1.7,1.9,2.0],
  oee: [76,78,72,81,80,83,77,79,82,74,84,85,83,82],
  downtime: { "Changeover":14, "Equipment fault":22, "Material shortage":9, "Quality hold":6, "Planned maintenance":12 },
  lines: [
    {name:"Line A", product:"Housing 120", output:1180, target:1200, oee:86, scrap:1.6, status:"Running"},
    {name:"Line B", product:"Housing 80",  output:1020, target:1150, oee:78, scrap:2.4, status:"Slow"},
    {name:"Line C", product:"Cover plate", output:1390, target:1300, oee:89, scrap:1.3, status:"Running"},
    {name:"Line D", product:"Bracket",     output:800,  target:750,  oee:0,  scrap:0,   status:"Down"}
  ]
};

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const avg = a => a.reduce((s,x)=>s+x,0)/a.length;
const fmt = n => n.toLocaleString("en-IN");

async function load(){
  try{ const r = await fetch("data.json",{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  return SAMPLE;
}

function kpi(label,value,delta,goodWhenUp){
  const good = (delta>=0)===goodWhenUp;
  return `<div class="panel kpi"><span>${label}</span><b>${value}</b><small class="${good?'up':'down'}">${delta>=0?'+':''}${delta.toFixed(1)} vs prior 7 days</small></div>`;
}

function render(d){
  const last7 = a => a.slice(-7), prev7 = a => a.slice(-14,-7);
  const tot = a => a.reduce((s,x)=>s+x,0);
  const outDelta = (tot(last7(d.output))/tot(prev7(d.output))-1)*100;
  document.getElementById("range").textContent = `${d.days[0]} to ${d.days[d.days.length-1]}`;
  document.getElementById("updated").textContent = `Updated ${d.updated}`;
  document.getElementById("kpis").innerHTML =
    kpi("Units, last 7 days", fmt(tot(last7(d.output))), outDelta, true).replace("vs prior 7 days","% vs prior 7 days") +
    kpi("Average OEE", avg(last7(d.oee)).toFixed(0)+"%", avg(last7(d.oee))-avg(prev7(d.oee)), true) +
    kpi("Scrap rate", avg(last7(d.scrapPct)).toFixed(1)+"%", avg(last7(d.scrapPct))-avg(prev7(d.scrapPct)), false) +
    kpi("Days at or above target", last7(d.output).filter(x=>x>=d.target).length+" of 7", last7(d.output).filter(x=>x>=d.target).length-prev7(d.output).filter(x=>x>=d.target).length, true);

  document.getElementById("lines").innerHTML = d.lines.map(l =>
    `<tr><td>${l.name}</td><td>${l.product}</td><td class="n">${fmt(l.output)}</td><td class="n">${fmt(l.target)}</td><td class="n">${l.oee}%</td><td class="n">${l.scrap}%</td><td><span class="tag ${l.status}">${l.status}</span></td></tr>`).join("");

  const grid = css("--line"), mute = css("--mute");
  Chart.defaults.font.family = "Barlow, system-ui, sans-serif";
  Chart.defaults.color = mute;
  new Chart(document.getElementById("outChart"),{
    type:"bar",
    data:{labels:d.days,datasets:[
      {label:"Output",data:d.output,backgroundColor:css("--accent"),borderRadius:2,order:2},
      {type:"line",label:"Target",data:d.days.map(()=>d.target),borderColor:css("--warn"),borderDash:[6,4],pointRadius:0,borderWidth:2,order:1}
    ]},
    options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{grid:{color:grid},beginAtZero:true}},plugins:{legend:{position:"bottom"}}}
  });
  new Chart(document.getElementById("dtChart"),{
    type:"bar",
    data:{labels:Object.keys(d.downtime),datasets:[{data:Object.values(d.downtime),backgroundColor:css("--amber"),borderRadius:2}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,scales:{x:{grid:{color:grid}},y:{grid:{display:false}}},plugins:{legend:{display:false}}}
  });
}
load().then(render);
</script>
</body>
</html>
