<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Projects</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--surface:#fff;--ink:#1b2140;--mute:#5d6584;--line:#d5d9e4;--accent:#2d3a8c;--accent-ink:#fff;--warn:#c2410c;--ok:#1f7a4d;--hi:#e0a21b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152b;--surface:#1b2040;--ink:#eceefb;--mute:#9aa2c8;--line:#2c3260;--accent:#8c9bff;--accent-ink:#12152b;--warn:#fb923c;--ok:#4ade80;--hi:#f2b84b}}
:root[data-theme="dark"]{--bg:#12152b;--surface:#1b2040;--ink:#eceefb;--mute:#9aa2c8;--line:#2c3260;--accent:#8c9bff;--accent-ink:#12152b;--warn:#fb923c;--ok:#4ade80;--hi:#f2b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:1.8rem;font-weight:800;line-height:1.1}
.stat span{color:var(--mute);font-size:.9rem}
.stat.late b{color:var(--warn)}
.overall{margin-bottom:24px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.overall p{margin:6px 0 0;color:var(--mute);font-size:.9rem}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.col h2{font-size:1rem;margin:0 0 10px;display:flex;justify-content:space-between;font-weight:600}
.col h2 em{font-style:normal;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card.p-high{border-left-color:var(--warn)}.card.p-med{border-left-color:var(--hi)}.card.p-low{border-left-color:var(--ok)}
.card h3{margin:0 0 2px;font-size:1.05rem}
.card p{margin:0 0 8px;color:var(--mute);font-size:.9rem}
.due{font-size:.85rem;color:var(--mute)}.due.over{color:var(--warn);font-weight:600}
.card input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
.row select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;text-decoration:underline}
.empty{color:var(--mute);font-size:.9rem;padding:12px;border:1px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(10,12,30,.5)}
label{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
dialog input,dialog select,dialog textarea{width:100%;margin-top:4px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>My Projects</h1>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" id="export">Export backup</button>
    <button class="btn" id="add">Add project</button>
  </div>
</header>
<section class="stats" id="stats" aria-label="Summary"></section>
<section class="overall"><div class="bar"><i id="ob" style="width:0"></i></div><p id="ot"></p></section>
<section class="board" id="board"></section>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h2 id="dt" style="margin:0">Add project</h2>
    <label>Name<input id="n" required maxlength="80"></label>
    <label>Notes<textarea id="no" rows="2" maxlength="300"></textarea></label>
    <div class="two">
      <label>Due date<input type="date" id="d"></label>
      <label>Priority<select id="p"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></label>
    </div>
    <label>Status<select id="s"></select></label>
    <div class="actions"><button type="button" class="btn ghost" id="cx">Cancel</button><button class="btn" id="sv" type="submit">Save project</button></div>
  </form>
</dialog>
</main>
<script>
const STATUS=[["todo","Not started"],["doing","In progress"],["blocked","Blocked"],["done","Done"]];
const KEY="my-projects-v1";
let items=[],editId=null;
const $=id=>document.getElementById(id);
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
if(!items.length){items=[
 {id:1,name:"Sample: Launch website",notes:"Replace or delete me.",due:"",pri:"high",st:"doing",pct:40},
 {id:2,name:"Sample: Write quarterly report",notes:"",due:"",pri:"med",st:"todo",pct:0}]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const today=()=>new Date().toISOString().slice(0,10);
function render(){
  const act=items.filter(i=>i.st!=="done");
  const late=act.filter(i=>i.due&&i.due<today()).length;
  const avg=items.length?Math.round(items.reduce((a,i)=>a+(i.st==="done"?100:i.pct),0)/items.length):0;
  $("stats").innerHTML=[["Total",items.length,""],["Active",act.length,""],["Blocked",items.filter(i=>i.st==="blocked").length,""],["Overdue",late,late?"late":""],["Done",items.length-act.length,""]]
    .map(([l,v,c])=>`<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join("");
  $("ob").style.width=avg+"%";
  $("ot").textContent=`Overall progress ${avg}%`;
  $("board").innerHTML=STATUS.map(([k,label])=>{
    const list=items.filter(i=>i.st===k);
    return `<div class="col"><h2>${label}<em>${list.length}</em></h2>`+(list.length?list.map(card).join(""):`<div class="empty">Nothing here yet.</div>`)+`</div>`}).join("");
}
function card(i){
  const over=i.due&&i.due<today()&&i.st!=="done";
  return `<article class="card p-${i.pri}"><h3>${esc(i.name)}</h3>${i.notes?`<p>${esc(i.notes)}</p>`:""}
  <div class="due ${over?"over":""}">${i.due?(over?"Overdue: ":"Due ")+i.due:"No due date"}</div>
  <input type="range" min="0" max="100" step="5" value="${i.pct}" aria-label="Progress for ${esc(i.name)}" data-pct="${i.id}">
  <div class="row"><span class="due">${i.pct}% done</span>
  <select aria-label="Status" data-st="${i.id}">${STATUS.map(([k,l])=>`<option value="${k}" ${k===i.st?"selected":""}>${l}</option>`).join("")}</select></div>
  <div class="row"><button class="lnk" data-edit="${i.id}">Edit</button><button class="lnk" data-del="${i.id}">Delete</button></div></article>`}
$("board").addEventListener("change",e=>{
  const t=e.target,id=+(t.dataset.pct||t.dataset.st);const it=items.find(x=>x.id===id);if(!it)return;
  if(t.dataset.pct){it.pct=+t.value;if(it.pct===100)it.st="done"}
  if(t.dataset.st){it.st=t.value;if(it.st==="done")it.pct=100}
  save();render()});
$("board").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.del){const it=items.find(x=>x.id===+t.dataset.del);if(it&&confirm(`Delete “${it.name}”?`)){items=items.filter(x=>x!==it);save();render()}}
  if(t.dataset.edit)openDlg(+t.dataset.edit)});
$("s").innerHTML=STATUS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
function openDlg(id){
  editId=id||null;const it=items.find(x=>x.id===id)||{name:"",notes:"",due:"",pri:"med",st:"todo"};
  $("dt").textContent=id?"Edit project":"Add project";
  $("n").value=it.name;$("no").value=it.notes;$("d").value=it.due;$("p").value=it.pri;$("s").value=it.st;
  $("dlg").showModal();$("n").focus()}
$("add").onclick=()=>openDlg();
$("cx").onclick=()=>$("dlg").close();
$("f").addEventListener("submit",()=>{
  const v={name:$("n").value.trim(),notes:$("no").value.trim(),due:$("d").value,pri:$("p").value,st:$("s").value};
  if(!v.name)return;
  if(editId){const it=items.find(x=>x.id===editId);Object.assign(it,v);if(v.st==="done")it.pct=100}
  else items.push({id:Date.now(),pct:v.st==="done"?100:0,...v});
  save();render()});
$("export").onclick=()=>{
  const t=JSON.stringify(items,null,2);
  const w=window.open("","_blank");
  if(w){w.document.write("<pre>"+esc(t)+"</pre>")}else{prompt("Copy your backup:",t)}};
render();
</script>
</body>
</html>
